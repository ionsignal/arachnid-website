    </filter>
    <filter
      id="card-shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="180%"
      color-interpolation-filters="sRGB">
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.3"
      />
    </filter>
  </defs>
