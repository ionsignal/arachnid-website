      y2="500"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#10213A" />
      <stop offset="0.55" stop-color="#0C1628" />
      <stop offset="1" stop-color="#07101E" />
    </linearGradient>
    <linearGradient
      id="capture-line"
      x1="270"
      y1="320"
      x2="390"
      y2="320"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F5FF" stop-opacity="0.28" />
      <stop offset="1" stop-color="#33B1FF" stop-opacity="0.88" />
    </linearGradient>
    <radialGradient
      id="capsule-glow"
      cx="0"
      cy="0"
      r="1"
