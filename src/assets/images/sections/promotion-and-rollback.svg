      stroke="#33B1FF"
      stroke-opacity="0.56"
    />
    <circle cx="114" cy="484" r="7" fill="#33B1FF" fill-opacity="0.14" />
    <path
      d="M110.5 484L113 486.5L117.5 481.5"
      stroke="#33B1FF"
      stroke-width="1.6"
      stroke-linecap="round"
