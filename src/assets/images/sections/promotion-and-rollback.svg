<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="640"
  viewBox="0 0 960 640"
  fill="none"
  role="img"
  aria-labelledby="title description">
  <title id="title">Approval-gated promotion and rollback</title>
  <desc id="description">
    An approved version 43 capsule is promoted to the generate route while
    version 42 remains available as a known-good rollback target.
  </desc>
  <defs>
    <linearGradient
      id="promotion-line"
      x1="390"
      y1="316"
      x2="742"
      y2="316"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#33B1FF" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>
    <linearGradient
      id="route-background"
      x1="704"
      y1="244"
      x2="892"
      y2="408"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#10293A" />
      <stop offset="1" stop-color="#08121E" />
    </linearGradient>
    <radialGradient
      id="route-glow"
      cx="0"
      cy="0"
      r="1"
      gradientTransform="translate(730 322) rotate(90) scale(210 260)"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.18" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <filter
      id="soft-glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
      color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter
      id="card-shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="180%"
      color-interpolation-filters="sRGB">
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.3"
      />
    </filter>
    <marker
      id="promotion-arrow"
      viewBox="0 0 8 8"
      refX="7"
      refY="4"
      markerWidth="8"
      markerHeight="8"
      orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#34D399" />
    </marker>
    <marker
      id="rollback-arrow"
      viewBox="0 0 8 8"
      refX="7"
      refY="4"
      markerWidth="8"
      markerHeight="8"
      orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#A0ABC0" />
    </marker>
  </defs>

  <ellipse
    cx="729"
    cy="326"
    rx="260"
    ry="220"
    fill="url(#route-glow)"
    filter="url(#soft-glow)"
  />

  <text
    x="68"
    y="82"
    fill="#33B1FF"
    font-family="JetBrains Mono, monospace"
    font-size="12"
    font-weight="500"
    letter-spacing="1.5">
    APPROVAL MOVES ROUTES — NOT ARTIFACTS
  </text>

  <g filter="url(#card-shadow)">
    <rect
      x="70"
      y="126"
      width="262"
      height="168"
      rx="20"
      fill="#0C1628"
      stroke="#A0ABC0"
      stroke-opacity="0.3"
      stroke-width="2"
    />
    <rect
      x="70"
      y="362"
      width="262"
      height="168"
      rx="20"
      fill="#0C1628"
      stroke="#33B1FF"
      stroke-opacity="0.72"
